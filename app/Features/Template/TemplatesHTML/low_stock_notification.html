<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low Stock Alert</title>
    <style>
        /* General Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        img {
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
            display: block; /* Ensures proper rendering in email clients */
        }

        a {
            text-decoration: none;
            color: #3869D4;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Container */
        .email-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #e0e0e0;
        }

        /* Header */
        .email-header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: center;
        }

        .email-header img {
            max-width: 80px;
            margin: 0 auto; /* Center the image */
        }

        /* Body */
        .email-body {
            padding: 20px;
        }

        .email-body h1 {
            font-size: 24px;
            color: #333333;
            margin: 0 0 20px;
        }

        .email-body p {
            font-size: 16px;
            color: #555555;
            line-height: 1.5;
            margin: 0 0 20px;
        }

        /* Button */
        .email-button {
            text-align: center;
            margin: 30px 0;
        }

        .email-button a {
            text-decoration: none;
            background-color: #1FA2C4;
            color: #BEF2FF;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            display: inline-block;
        }

        .email-button a:hover {
            background-color: #3fb4d4;
        }

        /* Footer */
        .email-footer {
            text-align: center;
            font-size: 12px;
            color: #999999;
            border-top: 1px solid #e0e0e0;
        }

        /* Social Icons */
        .social-icons {
            padding-bottom: 25px;
            padding-top: 15px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .social-icons .social-icon {
            margin: 0 10px;
        }
    </style>
</head>
<body>
<table class="email-container">
    <!-- Header -->
    <tr>
        <td class="email-header">
           E-Commerce
        </td>
    </tr>
    <!-- Body -->
    <tr>
        <td class="email-body">
            <h1>Low Stock Alert!</h1>
            <p>The product <strong>product_name</strong> is running low on stock.</p>
            <p>There are only <strong>quantity</strong> items left.</p>
            <div class="email-button">
                <a href="product_url">View Product</a>
            </div>
            <p>Please restock the product to avoid it going out of stock.</p>
        </td>
    </tr>
    <!-- Footer -->
    <tr align="center" class="email-footer">
        <td>
            <p>&copy; 2024 Your Company. All rights reserved.</p>
            <p>Your Company, 1234 Street, City, State, Zip</p>
        </td>
    </tr>
    <!-- Social Icons -->
    <tr align="center">
        <td class="social-icons">
            <a class="social-icon" target="_blank" href="https://www.facebook.com/"><img border="0" alt="Facebook" title="Facebook" width="22" height="22" src="https://raw.githubusercontent.com/konsav/email-templates/master/images/social-icons/facebook.png"></a>
            <a class="social-icon" target="_blank" href="https://twitter.com/"><img border="0" alt="Twitter" title="Twitter" width="22" height="22" src="https://raw.githubusercontent.com/konsav/email-templates/master/images/social-icons/twitter.png"></a>
        </td>
    </tr>
</table>
</body>
</html>
